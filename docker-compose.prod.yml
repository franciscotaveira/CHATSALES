networks:
  sos-sales-network:
    external: true

volumes:
  sos_sales_v3_pgdata:
    external: true
  sos_v3_redisdata:
    external: true
  sos_sales_waha_sessions:
    external: true

services:
  postgres:
    image: postgres:16-alpine
    container_name: sos-sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sos_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sos_secret_lab_2026}
      POSTGRES_DB: sos_sales_v3
    volumes:
      - sos_sales_v3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sos_user -d sos_sales_v3 || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sos-sales-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: sos-sales-redis
    restart: unless-stopped
    volumes:
      - sos_v3_redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sos-sales-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  waha:
    image: devlikeapro/waha:latest-2026.8.2@sha256:527ff3d634925adb26d596883d7b3ca502c080f737af3c2af2be0c973c511533
    container_name: sos-sales-waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      WAHA_ZIP_LOGS: "false"
      WAHA_LOG_LEVEL: info
      WAHA_PRINT_QR: "false"
      WAHA_BASE_URL: http://sos-sales-waha:3000
    volumes:
      - sos_sales_waha_sessions:/app/.sessions
    deploy:
      resources:
        limits:
          memory: 2560M
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ping || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sos-sales-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: chat-sales-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT_API: 4400
      API_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      INGRESS_DATABASE_URL: ${INGRESS_DATABASE_URL:?INGRESS_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: chat-sales-api
      AUTH_PROVIDER: ${AUTH_PROVIDER:?AUTH_PROVIDER is required}
      AUTH_ISSUER: ${AUTH_ISSUER:?AUTH_ISSUER is required}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?AUTH_AUDIENCE is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?NVIDIA_API_KEY is required}
      NVIDIA_TEMPLATE_MODEL: ${NVIDIA_TEMPLATE_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}
      MCT_CREDENTIALS_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://sos-sales-waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-mct_sos_waha_master_2026}
      ENABLE_LAB_SYNTHETIC: 'false'
      INTERNAL_SERVICE_ALLOWLIST: ${INTERNAL_SERVICE_ALLOWLIST:-sos-sales-waha,waha,chat-sales-waha,sos-v3-waha,evolution,sos-sales-evolution}
    expose:
      - '4400'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4400/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sos-sales-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: chat-sales-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required}
      DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: chat-sales-worker
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}
      MASTER_ENCRYPTION_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}
      ENABLE_LAB_SYNTHETIC: 'false'
      STRICT_TENANT_ISOLATION: 'true'
      WAHA_BASE_URL: http://sos-sales-waha:3000
      INTERNAL_SERVICE_ALLOWLIST: ${INTERNAL_SERVICE_ALLOWLIST:-sos-sales-waha,waha}
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/worker-healthy || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sos-sales-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: chat-sales-web
    restart: unless-stopped
    expose:
      - '80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80 || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sos-sales-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
